[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "olms"
version = "0.3.0"
description = "Shared scraping infrastructure for labordata's DOL OLMS pipelines (lm10, lm20)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "scrapy>=2.13",
    "itemadapter",
    "python-dateutil",
    "requests",
    "parsel",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["olms*"]
